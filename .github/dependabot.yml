version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      astro-cloudflare:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "wrangler"
          - "@cloudflare/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # Node typings track the runtime (CI + engines are Node 22), not latest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TS 7 (native port) is held until @astrojs/check supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
